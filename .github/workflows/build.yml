name: Build Installer

on:
  push:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: npm run dist-linux
      - name: Upload AppImage
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "PDF Studio v1.0.0"
          body: "PDF Studio desktop app — double-click the AppImage to run (no installation needed)"
          files: dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
