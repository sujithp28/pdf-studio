name: Build Installer

on:
  push:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: npm run dist-win
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "PDF Studio v1.0.0"
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: npm run dist-mac
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "PDF Studio v1.0.0"
          files: dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: npm run dist-linux
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "PDF Studio v1.0.0"
          files: dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
